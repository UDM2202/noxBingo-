<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NoxBingo — Solana Bingo Game, Win Real OREN Crypto</title>
    <meta name="description" content="Play crypto bingo on Solana and win real OREN tokens. Connect your wallet, join a room, and play bingo for real money prizes on NoxBingo." />
    <link rel="canonical" href="https://noxbingo.io/" />

    <!--
      Standard Open Graph + Twitter Card tags — this is what Google,
      Facebook, X, WhatsApp, LinkedIn etc. read for link previews.
      Separate from the fc:miniapp tag below, which is Farcaster's
      own, differently-shaped standard specifically for its feed.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://noxbingo.io/" />
    <meta property="og:site_name" content="NoxBingo" />
    <meta property="og:title" content="NoxBingo — Solana Bingo Game, Win Real OREN Crypto" />
    <meta property="og:description" content="Play crypto bingo on Solana and win real OREN tokens. Connect your wallet, join a room, and play bingo for real money prizes." />
    <meta property="og:image" content="https://noxbingo.io/embed-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NoxBingo — Solana Bingo Game, Win Real OREN Crypto" />
    <meta name="twitter:description" content="Play crypto bingo on Solana and win real OREN tokens. Connect your wallet, join a room, and play bingo for real money prizes." />
    <meta name="twitter:image" content="https://noxbingo.io/embed-image.png" />

    <meta name="google-site-verification" content="CzpGdnFcwd2MgV06Cx7pRV9tJxKa1H9nO4CkGGP86iw" />

    <!--
      Farcaster Mini App embed. This is what turns a shared link into
      a rich card in someone's feed — image + button, tapping it opens
      /miniapp. Replace REPLACE_WITH_YOUR_VERCEL_DOMAIN once deployed,
      and host real images at the required sizes before this works:
        - imageUrl: 3:2 ratio, at least 600x400px, PNG recommended
        - splashImageUrl: exactly 200x200px
      This tag must stay static in this file — Farcaster's crawler
      reads the raw HTML directly, it doesn't run this app's JS.
    -->
    <meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://nox-bingo-8x9m.vercel.app/embed-image.png","button":{"title":"Play NoxBingo","action":{"type":"launch_miniapp","name":"NoxBingo","url":"https://nox-bingo-8x9m.vercel.app/miniapp","splashImageUrl":"https://nox-bingo-8x9m.vercel.app/splash.png","splashBackgroundColor":"#0B0B45"}}}' />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
